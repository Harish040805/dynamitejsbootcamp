<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>DAS: Certificate of Completion</title>
<link rel="stylesheet" href="style.css">  
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
</head>
<body>
  <h2>Harish Creations</h2>
  <h1>DAS: DrawalgoSolve</h1>
<form id="nameForm" class="name-form" autocomplete="off">
  <label for="nameInput" class="name-label">Enter your name to generate certificate:</label>
  <input type="text" id="nameInput" class="name-input" placeholder="Your full name" required />
  <button type="submit" class="generate-btn">Generate Certificate</button>
  <button type="button" class="download-btn" id="downloadBtn">Download Certificate</button>
</form>
<div class="outer-border" role="region" aria-label="Certificate" id="certificateArea">
  <div class="inner-border">
    <div class="innerm-border">
      <br><br>
      <img src="https://github.com/Harish040805/drawalgosolve/blob/main/drawalgosolve.png?raw=true" alt="DAS Logo" class="logo">  
      <div class="bootcamp-title">DrawalgoSolve</div>
      <div class="certificate-title">🏅 Certificate of Completion</div>
      <br>
      <div class="awarded">This is to certify that</div>
      <div class="name-display" id="name">{name}</div>
      <br>
      <div class="description">
        has successfully completed
        <div class="course-title" style="font-size: 28px; font-weight: bold; margin: 10px 0;">DAS: DrawalgoSolve - 400 Modules</div>
        on
        <div class="date-display" style="font-weight: bold; margin: 10px 0;">12-Apr-2026</div>
      </div>
      <br><br>
      <div class="signatures" style="display: flex; justify-content: center; align-items: center;">
        <div style="text-align: center;">
          <img src="https://harish040805.github.io/newharishresume/harishsign.jpeg" style="height: 70px; width: 200px;">
          <br>
          <p>Signature of the Founder</p>
        </div>
      </div>
      <br><br>
    </div>
  </div>
</div>
<script>
const nameEl = document.getElementById("name");
const nameTextEl = document.getElementById("name-text");
const form = document.getElementById("nameForm");
const input = document.getElementById("nameInput");
const downloadBtn = document.getElementById("downloadBtn");
const certificateArea = document.getElementById("certificateArea");

function loadName() {
  const savedName = localStorage.getItem("certificateName");
  if (savedName) {
    updateCertificate(savedName);
    input.value = savedName;
  }
}
function updateCertificate(name) {
  nameEl.textContent = name;
  nameTextEl.textContent = name;
}
form.addEventListener("submit", e => {
  e.preventDefault();
  const enteredName = input.value.trim();
  if (!enteredName) {
    alert("Please enter your name.");
    return;
  }
  updateCertificate(enteredName);
  localStorage.setItem("certificateName", enteredName);
});
downloadBtn.addEventListener("click", () => {
  html2canvas(certificateArea).then(canvas => {
    const link = document.createElement("a");
    link.download = "Dynamitecertificate.png";
    link.href = canvas.toDataURL("image/png");
    link.click();
  });
});
loadName();
</script>
</body>
</html>
